<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('medipredict_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <title>MEDIPREDICT AI — Educational Healthcare ML Dashboard</title>
    <meta
      name="description"
      content="Educational healthcare machine learning dashboard for exploring Heart Disease, Diabetes, and Breast Cancer prediction workflows, datasets, and Scikit-learn evaluation concepts."
    />
    <meta property="og:title" content="MEDIPREDICT AI — Educational Healthcare ML Dashboard" />
    <meta
      property="og:description"
      content="Educational healthcare machine learning dashboard for exploring Heart Disease, Diabetes, and Breast Cancer prediction workflows, datasets, and Scikit-learn evaluation concepts."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 dark:bg-[#030714] text-slate-900 dark:text-slate-100 antialiased selection:bg-violet-100 selection:text-violet-900 dark:selection:bg-cyan-500/30 dark:selection:text-cyan-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
